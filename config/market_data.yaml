market_data:
  primary_signal_provider: tiingo
  primary_signal_feed: eod
  primary_signal_mode: historical_completed_daily_bars
  require_non_iex_primary_signal_data: true
  fail_if_primary_signal_feed_is_iex: true
  allow_iex_only_for_frozen_validation: false
  allow_delayed_sip_for_signal_generation: false
  non_iex_primary_signal_data_verified: false
  non_iex_primary_signal_data_waiver_enabled: false
  non_iex_primary_signal_data_waiver_reason: ""
  tiingo:
    enabled: true
    api_key_env: TIINGO_API_KEY
    base_url: https://api.tiingo.com
    eod_endpoint_template: /tiingo/daily/{symbol}/prices
    adjusted_prices_required: true
    completed_daily_bars_only: true
    min_history_bars: 260
    validation_sample_symbols:
      - SPY
      - QQQ
      - AAPL
      - MSFT
      - XLK
  alpaca:
    fallback_allowed_for_execution_broker: true
    fallback_allowed_for_signal_generation: false
    iex_allowed_for_signal_generation: false
