strategy:
  name: "regime_filtered_breakout_v0_3"
  trend_fast_ma: 50
  trend_slow_ma: 200
  breakout_lookback_primary: 20
  breakout_lookback_research_variants:
    - 20
    - 55
  volume_lookback_days: 20
  volume_ratio_min: 1.20
  relative_strength_lookback_days: 63
  relative_strength_min: 0.0
  relative_strength_percentile_floor_research: 70
  atr_period: 14
  atr_pct_min: 0.015
  atr_pct_max: 0.060
  initial_stop_atr_multiplier: 2.0
  initial_stop_atr_multiplier_research_variants:
    - 2.0
    - 2.5
  trailing_stop_atr_multiplier: 2.5
  trailing_stop_atr_multiplier_research_variants:
    - 2.5
    - 3.0
  technical_exit_ema: 10
  technical_exit_confirm_closes: 2
  time_stop_days: 20
  fail_fast_exit_days: 5

validation_strategy:
  active_breakout_lookback: 20
  research_breakout_lookbacks:
    - 55
  same_day_reentry_forbidden: true
  early_close_new_entries_allowed: false
  force_trades: false
  active_long_filters:
    - close_above_sma50
    - sma50_above_sma200
    - volume_ratio20
    - relative_strength63
    - atr_band
    - price_liquidity
    - earnings_blackout
  rejection_reasons:
    - early_close_session
    - execution_budget_exhausted
    - correlation_cluster_cap
    - same_day_reentry_forbidden
    - scale_in_stage_gate_not_met

validation_exits:
  protective_stop: true
  fail_fast_exit: true
  technical_exit_ema10: true
  time_stop: true
  app_level_trailing_stop: false
