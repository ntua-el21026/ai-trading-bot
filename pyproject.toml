[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-trading-bot"
version = "0.1.0"
description = "Spec-governed autonomous AI trading bot foundation."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "PyYAML>=6.0",
    "structlog>=24.1",
    "temporalio>=1.27.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["packages*", "apps*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Default fd capture uses the WSL Windows-mounted temp directory in this environment and can
# lose its temporary capture file during teardown. Sys capture keeps the exact pytest command
# stable without disabling capture or skipping tests.
addopts = ["--capture=sys"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
    "docs/project_analytics",
    "docs/project_structure",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true
